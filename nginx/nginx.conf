events {}

http {
  include mime.types;

  # если контейнер ещё не поднялся — резолвим через docker DNS на каждый запрос
  resolver 127.0.0.11 valid=10s;

  # certbot ходит сюда за подтверждением домена, редиректим всё остальное на https
  server {
    listen 80;
    listen [::]:80;
    server_name example.com api.example.com; # TODO: заменить на реальный домен после BOF-107

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # основной сайт — отдаёт клиент (SSR-сервер в контейнере client)
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com; # TODO: реальный домен

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # сюда добавить Content-Security-Policy (BOF-101)

    location / {
      set $client_upstream http://client:3000;
      proxy_pass $client_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # api.example.com — сюда клиент сейчас ходит напрямую (EXTERNAL_SERVER_URL),
  # отдельный поддомен вместо общего пути, чтобы не путать с роутами SPA типа /forum
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com; # TODO: реальный домен

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    location / {
      set $server_upstream http://server:3001;
      proxy_pass $server_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
