events {}

http {
  include mime.types;

  # если контейнер ещё не поднялся — резолвим через docker DNS на каждый запрос
  resolver 127.0.0.11 valid=10s;

  # certbot ходит сюда за подтверждением домена, редиректим всё остальное на https
  server {
    listen 80;
    listen [::]:80;
    server_name bugorfeature-catsweeper.ya-praktikum.tech;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # поддомена под API нет, один домен на клиента и сервер —
  # бэкенд отдаём по тем же путям, что и dev-прокси в vite.config.ts
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bugorfeature-catsweeper.ya-praktikum.tech;

    ssl_certificate     /etc/letsencrypt/live/bugorfeature-catsweeper.ya-praktikum.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bugorfeature-catsweeper.ya-praktikum.tech/privkey.pem;

    # роуты packages/server/index.ts — всё остальное уходит клиенту
    location ~ ^/(auth|oauth/yandex|user|leaderboard|api/v2/resources|forum|theme)(/|$) {
      set $server_upstream http://server:3001;
      proxy_pass $server_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $client_upstream http://client:3000;
      proxy_pass $client_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
