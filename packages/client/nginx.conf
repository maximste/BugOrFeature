events {
}

http {
    include mime.types;
    server {
        listen 80;
        listen [::]:80;

        location / {
            root /app;
            try_files $uri /index.html;
            add_header Access-Control-Allow-Origin *;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://ya-praktikum.tech; connect-src 'self' https://ya-praktikum.tech; media-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'self' https://oauth.yandex.ru; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
        }
    }
}